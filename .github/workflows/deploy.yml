name: Deploy

# Only a green CI run of a push to main reaches production. A separate workflow, because CI cancels
# superseded runs and that must never interrupt a deploy halfway through.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/amriteshwork/hyperplane
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  images:
    name: Build ${{ matrix.image }} image
    # `branches` above matches by name only, so also rule out a PR from a fork's `main`.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: backend
            dockerfile: infra/docker/backend.Dockerfile
          - image: web
            dockerfile: infra/docker/frontend.Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Deploy to production
    needs: images
    runs-on: ubuntu-latest
    # The environment holds the SSH secrets and is restricted to main in the repo settings.
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
      - name: Copy the stack definition
        run: |
          tar -czf - infra/docker-compose.yml infra/docker-compose.prod.yml infra/garage infra/deploy.sh \
            | ssh "$TARGET" 'tar -xzf - -C /opt/hyperplane'
      - name: Roll out
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | ssh "$TARGET" "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh "$TARGET" "IMAGE_PREFIX='$IMAGE_PREFIX' /opt/hyperplane/infra/deploy.sh '$IMAGE_TAG'"
      - name: Forget the registry token
        if: always()
        run: ssh "$TARGET" 'docker logout ghcr.io' || true
