# Serves the Angular build and reverse-proxies /api to FastAPI.

# Keep upgrade/keep-alive semantics correct for proxied requests.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads (ARCHITECTURE §10: ≤ 50 MB) + multipart overhead.
    client_max_body_size 55m;

    server_tokens off;
    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Container healthcheck (does not touch the API).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Server-Sent Events (/runs/{id}/events): stream immediately, allow long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Hashed build assets: cache forever.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # SPA fallback; never cache the shell so new deploys are picked up.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
