<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hyperplane</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Learn machine learning by doing: train models and read the exact code that ran."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Apply the theme before first paint (same key and logic as ThemeService).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('hyperplane-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
